<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Plush Rabbit - happy expression -->
  <defs>
    <radialGradient id="rabbitBody" cx="50%" cy="40%">
      <stop offset="0%" stop-color="#F5F5F5"/>
      <stop offset="100%" stop-color="#E0E0E0"/>
    </radialGradient>
    <radialGradient id="rabbitBelly" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#FFF9C4"/>
      <stop offset="100%" stop-color="#FFF176"/>
    </radialGradient>
  </defs>
  <!-- Long ears -->
  <ellipse cx="78" cy="35" rx="12" ry="32" fill="url(#rabbitBody)" stroke="#BDBDBD" stroke-width="2"/>
  <ellipse cx="122" cy="35" rx="12" ry="32" fill="url(#rabbitBody)" stroke="#BDBDBD" stroke-width="2"/>
  <ellipse cx="78" cy="38" rx="6" ry="22" fill="#F48FB1" opacity="0.5"/>
  <ellipse cx="122" cy="38" rx="6" ry="22" fill="#F48FB1" opacity="0.5"/>
  <!-- Head -->
  <ellipse cx="100" cy="85" rx="48" ry="44" fill="url(#rabbitBody)" stroke="#BDBDBD" stroke-width="2"/>
  <!-- Belly patch -->
  <ellipse cx="100" cy="95" rx="32" ry="28" fill="url(#rabbitBelly)" opacity="0.4"/>
  <!-- Eyes (happy, sparkly) -->
  <ellipse cx="78" cy="80" rx="8" ry="9" fill="#3E2723"/>
  <ellipse cx="122" cy="80" rx="8" ry="9" fill="#3E2723"/>
  <circle cx="81" cy="77" r="3" fill="#fff"/>
  <circle cx="125" cy="77" r="3" fill="#fff"/>
  <circle cx="76" cy="82" r="1.5" fill="#fff"/>
  <circle cx="120" cy="82" r="1.5" fill="#fff"/>
  <!-- Cheeks -->
  <circle cx="62" cy="95" r="8" fill="#F48FB1" opacity="0.4"/>
  <circle cx="138" cy="95" r="8" fill="#F48FB1" opacity="0.4"/>
  <!-- Nose (Y-shaped) -->
  <path d="M96 96 L100 100 L104 96 Z" fill="#EC407A"/>
  <path d="M100 100 L100 105" stroke="#EC407A" stroke-width="2" stroke-linecap="round"/>
  <!-- Mouth (happy) -->
  <path d="M100 105 Q93 112 88 108" fill="none" stroke="#9E9E9E" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M100 105 Q107 112 112 108" fill="none" stroke="#9E9E9E" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Body hint -->
  <ellipse cx="100" cy="165" rx="58" ry="30" fill="url(#rabbitBody)" stroke="#BDBDBD" stroke-width="2"/>
  <!-- Paws -->
  <ellipse cx="70" cy="185" rx="14" ry="10" fill="url(#rabbitBody)" stroke="#BDBDBD" stroke-width="2"/>
  <ellipse cx="130" cy="185" rx="14" ry="10" fill="url(#rabbitBody)" stroke="#BDBDBD" stroke-width="2"/>
</svg>
