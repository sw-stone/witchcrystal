<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Breathing Orbit</title>
  <style>
    :root{--bg:#090909;--cream:#f7e5bc;--gold:#e8b65e;--glow:#f3bb5d;--phase:0;--lum:.5;--left-scale:.78;--right-scale:1}
    *{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:#080808;color:var(--cream);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif}
    body{display:grid;place-items:center;padding:clamp(12px,2vw,26px);overflow-x:hidden}
    .gallery{width:min(1320px,100%);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
    .panel{position:relative;isolation:isolate;overflow:hidden;min-height:min(94vh,1180px);border-radius:28px;background:#010101;box-shadow:0 0 0 1px rgba(255,255,255,.035),0 22px 80px rgba(0,0,0,.55)}
    .panel canvas{position:absolute;inset:0;width:100%;height:100%;z-index:-3}.panel:before{content:"";position:absolute;inset:0;z-index:-2;background:radial-gradient(circle at 50% 58%,rgba(190,124,37,.16),transparent 34%),linear-gradient(180deg,rgba(0,0,0,.04),rgba(0,0,0,.18))}.panel:after{content:"";position:absolute;inset:0;z-index:8;pointer-events:none;background:radial-gradient(ellipse at center,transparent 46%,rgba(0,0,0,.28) 100%)}
    .timer{position:absolute;top:clamp(74px,9vh,124px);left:50%;transform:translateX(-50%);font-size:clamp(31px,3.3vw,54px);font-weight:500;letter-spacing:.03em;color:#f6e8ca;text-shadow:0 0 20px rgba(255,219,151,.15);font-variant-numeric:tabular-nums;z-index:5}
    .orbit{position:absolute;left:50%;top:53%;width:74%;aspect-ratio:1;transform:translate(-50%,-50%);z-index:2}
    .halo{position:absolute;inset:-2%;border-radius:50%;border:0;background:radial-gradient(circle,transparent 48%,rgba(255,229,173,.2) 57%,rgba(242,180,77,.12) 65%,transparent 76%);transform:scale(calc(.76 + var(--phase)*.19));opacity:calc(.34 + var(--phase)*.3);filter:blur(12px)}
    .halo:nth-child(2){inset:6%;transform:scale(calc(.85 + var(--phase)*.15));opacity:calc(.27 + var(--phase)*.24);filter:blur(18px);background:radial-gradient(circle,transparent 42%,rgba(255,241,203,.18) 57%,rgba(235,169,62,.1) 69%,transparent 80%)}
    .halo:nth-child(3){inset:14%;transform:scale(calc(.94 + var(--phase)*.11));opacity:calc(.2 + var(--phase)*.2);filter:blur(22px);background:radial-gradient(circle,transparent 38%,rgba(255,224,157,.18) 62%,transparent 82%)}
    .orb{position:absolute;left:50%;top:50%;width:54%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%) scale(var(--orb-scale));background:radial-gradient(circle at 50% 48%,rgba(255,250,219,.99) 0 7%,rgba(255,228,157,.96) 18%,rgba(247,190,82,.88) 38%,rgba(206,125,35,.64) 60%,rgba(122,66,20,.26) 78%,transparent 100%);box-shadow:0 0 calc(25px + var(--lum)*18px) rgba(255,236,187,calc(.42 + var(--lum)*.28)),0 0 calc(68px + var(--lum)*48px) rgba(255,192,80,calc(.28 + var(--lum)*.34)),0 0 calc(150px + var(--lum)*100px) rgba(224,139,35,calc(.18 + var(--lum)*.26));overflow:visible;transition:transform 100ms linear,filter 100ms linear,box-shadow 100ms linear;filter:blur(3px) brightness(calc(.88 + var(--lum)*.38)) saturate(calc(.92 + var(--lum)*.1))}
    .orb:before{content:"";position:absolute;inset:-13%;border-radius:50%;background:radial-gradient(circle,rgba(255,248,220,.08) 25%,rgba(255,224,165,.18) 48%,rgba(255,194,92,.1) 62%,transparent 76%);filter:blur(16px);mix-blend-mode:screen;opacity:calc(.58 + var(--lum)*.34)}.orb:after{content:"";position:absolute;inset:10%;border-radius:50%;background:radial-gradient(circle at 45% 43%,rgba(255,255,233,.52),rgba(255,229,158,.18) 38%,transparent 72%);filter:blur(12px);opacity:calc(.55 + var(--lum)*.35)}
    .modes{position:absolute;left:50%;bottom:45px;z-index:10;display:flex;gap:6px;transform:translateX(-50%);padding:5px;border:1px solid rgba(255,224,163,.17);border-radius:999px;background:rgba(255,232,187,.045);backdrop-filter:blur(12px)}.mode{width:48px;height:34px;border:0;border-radius:999px;background:transparent;color:rgba(255,230,180,.48);font:500 13px/1 inherit;cursor:pointer}.mode.active{color:#fff0cb;background:rgba(255,210,128,.17);box-shadow:inset 0 0 0 1px rgba(255,226,173,.2),0 0 18px rgba(238,167,59,.08)}
    @media(max-width:720px){body{padding:10px}.gallery{grid-template-columns:1fr;gap:14px}.panel{min-height:88vh;border-radius:22px}.panel:nth-child(2){display:none}.timer{top:56px}.orbit{top:49%;width:82%}.modes{bottom:28px}}
    @media(prefers-reduced-motion:reduce){.orb,.halo{transition:none}}
  </style>
</head>
<body>
  <main class="gallery" aria-label="Breathing meditation interface">
    <section class="panel" data-side="out" aria-label="Breathe out">
      <canvas></canvas><div class="timer">01:00</div>
      <div class="orbit"><div class="halo"></div><div class="halo"></div><div class="halo"></div><div class="orb"></div></div>
      <div class="modes"><button class="mode active" data-seconds="60">1 分钟</button><button class="mode" data-seconds="180">3 分钟</button></div>
    </section>
    <section class="panel" data-side="in" aria-label="Breathe in">
      <canvas></canvas><div class="timer">01:00</div>
      <div class="orbit"><div class="halo"></div><div class="halo"></div><div class="halo"></div><div class="orb"></div></div>
      <div class="modes"><button class="mode active" data-seconds="60">1 分钟</button><button class="mode" data-seconds="180">3 分钟</button></div>
    </section>
  </main>
  <script>
    const panels=[...document.querySelectorAll('.panel')],cycleSeconds=12;let sessionSeconds=60,elapsed=0,running=true,last=performance.now();
    const starsFor=canvas=>{const ctx=canvas.getContext('2d');let dpr=1,stars=[];function resize(){dpr=Math.min(devicePixelRatio||1,2);canvas.width=canvas.clientWidth*dpr;canvas.height=canvas.clientHeight*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);stars=Array.from({length:Math.min(460,Math.floor(canvas.clientWidth*canvas.clientHeight/2600))},()=>({x:Math.random()*canvas.clientWidth,y:Math.random()*canvas.clientHeight,r:Math.random()*1.15+.12,a:Math.random()*.82+.12,p:Math.random()*6.28,s:Math.random()*1.4+.35,w:Math.random()<.3}));}function draw(t){ctx.clearRect(0,0,canvas.clientWidth,canvas.clientHeight);for(const s of stars){const f=.48+.52*Math.sin(t*.001*s.s+s.p);ctx.globalAlpha=Math.max(.05,s.a*f);ctx.fillStyle=s.w?'#ffd98b':'#efe4cc';ctx.shadowColor=s.w?'#ffc967':'#fff1ce';ctx.shadowBlur=s.r> .8?4*f:1.5*f;ctx.beginPath();ctx.arc(s.x,s.y,s.r*(.72+.42*f),0,Math.PI*2);ctx.fill();if(s.r>1&&f>.88){ctx.globalAlpha*=.5;ctx.strokeStyle=ctx.fillStyle;ctx.lineWidth=.55;ctx.beginPath();ctx.moveTo(s.x-4,s.y);ctx.lineTo(s.x+4,s.y);ctx.moveTo(s.x,s.y-4);ctx.lineTo(s.x,s.y+4);ctx.stroke();}}ctx.shadowBlur=0;ctx.globalAlpha=1}addEventListener('resize',resize,{passive:true});resize();return{draw};};
    const canvases=panels.map(p=>starsFor(p.querySelector('canvas')));
    let audioReady=false,lastPhase='';const breathIn=new Audio('breathin.mp3'),breathOut=new Audio('breathout.mp3');[breathIn,breathOut].forEach(a=>{a.preload='auto';a.volume=.82});
    function enableAudio(){audioReady=true;breathIn.load();breathOut.load()}
    function playBreath(phase){if(!audioReady||phase===lastPhase)return;lastPhase=phase;const sound=phase==='in'?breathIn:breathOut;breathIn.pause();breathOut.pause();sound.currentTime=0;sound.play().catch(()=>{})}
    function tick(now){const dt=Math.min((now-last)/1000,.05);last=now;if(running)elapsed=(elapsed+dt)%sessionSeconds;const c=elapsed%cycleSeconds,inhale=c<4,phase=inhale?c/4:(c-4)/8,ease=inhale?(1-Math.cos(phase*Math.PI))/2:(1+Math.cos(phase*Math.PI))/2;playBreath(inhale?'in':'out');panels.forEach(p=>{const scale=.78+ease*.28,lum=Math.max(0,Math.min(1,(scale-.78)/.28));p.style.setProperty('--orb-scale',scale.toFixed(4));p.style.setProperty('--lum',lum.toFixed(4));p.style.setProperty('--phase',ease.toFixed(4));const remain=Math.max(0,sessionSeconds-elapsed),mm=Math.floor(remain/60).toString().padStart(2,'0'),ss=Math.floor(remain%60).toString().padStart(2,'0');p.querySelector('.timer').textContent=mm+':'+ss;});canvases.forEach(c=>c.draw(now));requestAnimationFrame(tick)}
    document.addEventListener('pointerdown',enableAudio,{once:true});document.querySelectorAll('.mode').forEach(button=>button.addEventListener('click',()=>{enableAudio();sessionSeconds=Number(button.dataset.seconds);elapsed=0;running=true;lastPhase='';document.querySelectorAll('.mode').forEach(b=>b.classList.toggle('active',b.dataset.seconds===button.dataset.seconds));last=performance.now()}));requestAnimationFrame(tick);
  </script>
</body>
</html>
