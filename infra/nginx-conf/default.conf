# MBTI 项目 Nginx 反向代理
# 接收 Cloudflare Tunnel 的请求, 反代到 gateway
#
# 端口: 80 (容器内)
# 通过 docker-compose 映射到主机 8080

# 连接数 / 性能
upstream gateway_backend {
    server gateway:8000;
    keepalive 32;
}

# 限流(避免 mock 演示被脚本打死)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

# ======================== Tarot Aura Web 应用入口 ========================
# 同时支持两个域名（NS 生效前的临时入口 + 正式入口）：
#   - tarot.mbti.shitman666.top  ← CF 已托管，立即可用（推荐先用这个）
#   - tarot.sh.cn                 ← NS 迁移到 CF 生效后启用
# 根路径直接走 /tarot（gateway 提供 tarot.html），其余路径与默认 server 共用反代
server {
    listen 80;
    server_name tarot.sh.cn tarot.mbti.shitman666.top;

    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    real_ip_header CF-Connecting-IP;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;
    client_max_body_size 10m;

    location = /health {
        access_log off;
        return 200 'ok\n';
        add_header Content-Type text/plain;
    }

    # 根路径 → 塔罗应用（gateway 的 /tarot 路由返回 tarot.html）
    location = / {
        proxy_pass http://gateway_backend/tarot;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location /ws/ {
        proxy_pass http://gateway_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /divination/tarot/interpret-stream {
        proxy_pass http://gateway_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        chunked_transfer_encoding on;
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    location / {
        limit_req zone=api_limit burst=40 nodelay;
        proxy_pass http://gateway_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }
}

server {
    listen 80 default_server;
    server_name _;

    # Cloudflare 真实客户端 IP
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    real_ip_header CF-Connecting-IP;

    # 日志
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # 主体大小(LLM 长回答)
    client_max_body_size 10m;

    # 健康检查(Cloudflare 探测用)
    location = /health {
        access_log off;
        return 200 'ok\n';
        add_header Content-Type text/plain;
    }

    # WebSocket 透传(社交服务实时推送 / NFC 碰一碰)
    location /ws/ {
        proxy_pass http://gateway_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WS 长连接超时拉长
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SSE 流式接口（塔罗实时 AI 解读）——必须关闭缓冲，否则前端收不到增量
    location /divination/tarot/interpret-stream {
        proxy_pass http://gateway_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # 关键：禁用 nginx 缓冲，让 SSE 立即透传到浏览器
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        chunked_transfer_encoding on;

        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    # 普通业务接口
    location / {
        limit_req zone=api_limit burst=40 nodelay;

        proxy_pass http://gateway_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # LLM 可能慢, 给足超时
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }
}
